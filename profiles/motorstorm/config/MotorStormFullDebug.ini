; Full MotorStorm debugging; same gameplay settings, all general diagnostics enabled. Captures every GE submission and retains the latest 120 slots; logs, textures and audio can grow quickly.
; Select with run.ps1 -Config <path>, or copy beside the executable as MotorStormNative.ini.
; Relative paths resolve against this INI; environment/launcher options take precedence.

[graphics]
renderer = d3d12
resolution = 4
antialiasing = FXAA
texture_filtering = enhanced
widescreen = auto
vsync = true
fps = 60
dynamic_fps = false

[enhancements]
enabled = true
color_depth = 32
color_correction = true
exposure = 0.0
contrast = 1.0
saturation = 1.0
temperature = 0.0
tint = 0.0
sharpening = true
sharpening_strength = 0.2
hud_ungraded = true
soft_particles = true
soft_particle_softness = 600

[window]
enabled = true
fullscreen = true
fullscreen_mode = exclusive
fullscreen_refresh = 0
scale = 2

[audio]
enabled = true
api = wasapi

[textures]
replace = true
replace_dir = textures_bc7
budget_mb = 4192
dump = true
dump_dir = debug_textures

[paths]

[logging]
log_file = MotorStormFullDebug.log
trace_imports = true
trace_filesystem = true
verbose = true

[runtime]
max_dispatches = 4000000000

[debug]
profile = true
trace_controller = true
trace_rumble = true
trace_music = true
trace_atrac = true
trace_display = true
pc_sample = true
d3d12_debug = true
trace_state = true
trace_switch = true
trace_flags = true
trace_callback_owner = true
trace_preempt = true
stack_scan = true
frame_dump = true
frame_dump_both = true
frame_dump_rolling = true
frame_dump_every = 1
frame_dump_count = 120
frame_dump_dir = debug_frames
memory_dump = MotorStormFullDebug.ram.bin
audio_capture = MotorStormFullDebug.audio.raw

