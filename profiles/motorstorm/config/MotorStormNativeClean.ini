; Your current MotorStormNative.ini settings, with unsupported/removed options omitted.
; Select with run.ps1 -Config <path>, or copy beside the executable as MotorStormNative.ini.
; Relative paths resolve against this INI; environment/launcher options take precedence.

[graphics]
renderer = d3d12
resolution = 4
antialiasing = FXAA
texture_filtering = enhanced
widescreen = auto
vsync = true
fps = 60
dynamic_fps = false

[enhancements]
enabled = true
color_depth = 32
color_correction = true
exposure = 0.0
contrast = 1.0
saturation = 1.0
temperature = 0.0
tint = 0.0
sharpening = true
sharpening_strength = 0.2
hud_ungraded = true
soft_particles = true
soft_particle_softness = 600

[window]
enabled = true
fullscreen = true
fullscreen_mode = exclusive
fullscreen_refresh = 0
scale = 2

[audio]
enabled = true
api = wasapi

[textures]
replace = true
replace_dir = textures_bc7
budget_mb = 4192

[paths]

[logging]
log_file = MotorStormNative.log

[runtime]
max_dispatches = 4000000000

[debug]

