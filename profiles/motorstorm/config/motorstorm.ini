; MotorStormNative profile configuration.
;
; Every key is optional.  Command-line arguments and PSPRECOMP_* environment
; variables take precedence over this file:
;   PSPRECOMP_MOTORSTORM_EBOOT, PSPRECOMP_MOTORSTORM_DISC,
;   PSPRECOMP_MOTORSTORM_LOG, PSPRECOMP_MAX_DISPATCHES,
;   PSPRECOMP_TIME_TICK_DISPATCHES

[paths]
; Decrypted MotorStorm EBOOT (PSP PRX).  Relative paths resolve against the
; executable directory.  The default search also checks:
;   <exe>/PSP_DATA/EBOOT_DECRYPTED.BIN, <exe>/game/EBOOT_DECRYPTED.BIN and
;   <repo>/profiles/motorstorm/game/EBOOT_DECRYPTED.BIN
; eboot = game/EBOOT_DECRYPTED.BIN

; Directory exposed to the guest as disc0:/ (the decrypted UMD tree).
; eboot.  Leave unset to auto-detect <eboot_dir>/disc0.
; disc_root = game/disc0

[logging]
; log_file = MotorStormNative.log
; trace_imports = true
; trace_filesystem = true
; verbose = false

[runtime]
; max_dispatches = 4000000000
