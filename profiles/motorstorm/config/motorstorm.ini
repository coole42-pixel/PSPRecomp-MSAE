; MotorStorm: Arctic Edge - native PC settings
; Edit MotorStormNative.ini beside MotorStormNative.exe, then restart the game.
; Lines beginning with ; are comments. Remove ; to enable a debug example.
; Explicit PSPRECOMP_* environment options / launcher flags override this INI.
; Rebuilding preserves your INI; MotorStormNative.default.ini is the fresh sample.

[graphics]
; d3d12 = hardware rendering (requires a GPU with rasterizer ordered views).
; auto = try hardware, report a software fallback. software = native PSP reference.
renderer = d3d12
; Actual internal resolution: 1=480x272, 2=960x544, 3=1440x816, 4=1920x1088.
; This is independent of window size. Software rendering stays at 480x272.
resolution = 4
; None = no filtering. FXAA = low-cost edge smoothing: a clean image at the
; original look (the default). SSAA2x = about two samples per pixel (1.5x per
; axis, area-weighted): the middle ground; at 4x this rasterizes at 2880x1632,
; at 1x at 720x408. SSAA4x = four samples per output pixel; at 4x this
; rasterizes at 3840x2176 (much more GPU work).
antialiasing = FXAA
; psp = the PSP's exact texture filtering. enhanced = anisotropic filtering with
; generated mipmaps for original textures (less shimmer at high resolution,
; not PSP exact). Texture-pack replacements are always filtered this way.
texture_filtering = psp
; auto = gameplay gains horizontal view to match wider windows / monitors
; (16:9, 21:9, 32:9). HUD keeps its proportions in the centre. Menus, movies
; and narrower windows retain the PSP aspect. psp disables this D3D12 fix.
widescreen = auto
; true = present on the display refresh (even frames, no tearing). The game
; never waits for the display either way; false lowers latency and may tear.
vsync = true
; Frame rate cap. The PSP original runs at 30 fps; original keeps its exact pacing.
; 30-240 unlocks the game simulation at that rate (60 = smooth PSP 60 Hz display).
; Rates other than 30/60 also run the virtual display at that rate. Higher rates
; need a faster CPU: if the PC cannot keep up, the game runs in slow motion.
fps = 60
; true = if the PC cannot keep the fps above at full speed (slow motion, audio
; gaps), drop to the original 30 fps and return to the target when it can.
dynamic_fps = true

[enhancements]
; Modern image effects for the d3d12 renderer. They apply ONLY while racing
; (the race countdown and the race itself) and fade in/out over half a second;
; menus, the pause menu, loading screens and movies keep the original image.
; Every effect has its own switch; enabled = false turns them all off.
enabled = true
; 32 = 32-bit colour: the game's 16-bit render targets keep full 8-bit colour
; channels, and the steps of 16-bit gradients (sky, fog, shading) are smoothed
; out. 16 = the PSP's original 16-bit colour.
color_depth = 32
; agx = AgX filmic tone mapping (https://github.com/bWFuanVzYWth/AgX): natural
; highlight roll-off and desaturation like film. none = the game's own tones.
tonemapping = agx
; AgX look: none (neutral, flatter), punchy (more contrast and saturation) or
; golden (warm, sunlit).
agx_look = punchy
; The PSP image has no highlights above white. It is expanded so that white
; becomes this many times brighter before AgX rolls it off (1.0 to 16.0;
; higher = brighter whites). Mid tones keep the game's brightness either way.
hdr_peak = 6.0
; Colour correction, in linear light before tone mapping.
color_correction = true
exposure = 0.0           ; EV, -3.0 to 3.0
contrast = 1.0           ; 0.5 to 2.0 (1.0 = unchanged)
saturation = 1.0         ; 0.0 (grey) to 2.0
temperature = 0.0        ; -1.0 (cool) to 1.0 (warm)
tint = 0.0               ; -1.0 (green) to 1.0 (magenta)
; Colour lookup table after tone mapping. The built-in one is a subtle
; photorealistic grade (gentle S-curve, cool shadows, warm highlights, softer
; neon colours). lut_file loads a 3D .cube LUT instead (relative to this INI).
lut = true
; lut_file = luts/my_grade.cube
lut_strength = 1.0       ; 0.0 to 1.0
; AMD FidelityFX Contrast Adaptive Sharpening.
sharpening = true
sharpening_strength = 0.2 ; 0.0 (subtle) to 1.0 (strong)
; true = the race HUD (health bars, speedometer, text) keeps the game's own
; colours instead of going through tone mapping, the LUT and sharpening.
hud_ungraded = true
; Bloom: bright highlights (sun glints, chrome, lights, the brightest snow)
; glow softly into their surroundings. Off by default. It works on the AgX
; scene light, so it needs tonemapping = agx. strength 0.0 to 1.0; threshold is
; the scene brightness where glow starts (0.5 to 16; higher = only the very
; brightest highlights, 3.0 is near display white).
bloom = false
bloom_strength = 0.15
bloom_threshold = 3.0

[window]
; false = headless diagnostics, true = show the native game window.
enabled = true
; Borderless fullscreen fills the current monitor; widescreen controls gameplay aspect.
; F11 or Alt+Enter toggles fullscreen. Escape returns to windowed mode;
; Escape in windowed mode closes the game. Alt+F4 / the close button also exits.
; This key belongs in [window]. The log's [CONFIG] line shows the value used
; and reports a PSPRECOMP_MOTORSTORM_FULLSCREEN environment override.
fullscreen = false
; borderless = fullscreen window (instant switching). exclusive = the game owns
; the display while focused (Alt+Tab leaves it); fullscreen_refresh picks its
; refresh rate in Hz (0 = keep the desktop rate, 60 = best for 60 fps).
fullscreen_mode = borderless
fullscreen_refresh = 0
; Initial windowed size: 1..8 times 480x272. Ignored while fullscreen.
scale = 2

[audio]
; true enables music and sound through the Windows audio device; false mutes output.
enabled = true
; wasapi = low-latency Windows audio (about 0.16 s less delay); waveout = legacy
; output. WASAPI falls back to waveout by itself if the device refuses it.
api = wasapi

[textures]
; Texture packs. tools/extract-textures.ps1 writes every texture on the disc as
; <hash>_<w>x<h>.png. Upscale them (keep the 16-digit hash prefix) and put the
; results, or DDS files from tools/pack-textures.ps1, in replace_dir. Any
; resolution works; files load in the background and never stall the game.
replace = true
; replace_dir = textures/replace
; GPU memory for loaded replacements (MB); least recently used are freed above it.
budget_mb = 1024
; In-game dumping of every texture drawn (for textures coloured at runtime):
; dump = true
; dump_dir = textures/dump

[paths]
; Optional paths; relative paths resolve against this INI's directory.
; Defaults find game/EBOOT_DECRYPTED.BIN or PSP_DATA/EBOOT_DECRYPTED.BIN beside
; the executable, or profiles/motorstorm/game/ in a source-tree build.
; disc_root should contain PSP_GAME/ directly. Game files are supplied by you.
; eboot = game/EBOOT_DECRYPTED.BIN
; disc_root = game/disc0

[logging]
; Normal startup/errors and a shutdown summary are logged here.
log_file = MotorStormNative.log
; Enable detailed PSP import or archive-file activity when investigating a problem.
; trace_imports = true
; trace_filesystem = true
; verbose = true

[runtime]
; Maximum guest dispatches before a diagnostic stop. The normal limit is generous.
max_dispatches = 4000000000

[debug]
; All options below are off unless uncommented. They can slow the game / grow logs.
; profile = true             ; shutdown timing breakdown (CPU, GE, GPU and audio)
; trace_controller = true    ; controller input records
; trace_music = true         ; music mixing / ring-buffer state
; trace_atrac = true         ; soundtrack decode and streaming details
; trace_display = true       ; framebuffer / guest display state
; pc_sample = true           ; sampled guest program-counter counters
; d3d12_debug = true         ; requires Windows Graphics Tools / D3D12 debug layer
; stop_after_ge = 5000       ; stop after this many GE lists for bounded reproductions
; Frame dumps contain game imagery. Keep them local; they are diagnostic output.
; frame_dump = true
; frame_dump_every = 60      ; capture one frame every 60 GE submissions
; frame_dump_count = 10      ; maximum number of captures
; frame_dump_dir = captures  ; relative to this INI's directory
