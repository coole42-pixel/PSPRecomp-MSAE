; Full MotorStorm diagnostics: every trace, profiler, dump and capture option on,
; with every race enhancement enabled so all D3D12 post paths are exercised.
; Windowed so the D3D12 debug layer and a debugger stay usable. Expect it to run
; slowly; logs, frame/texture dumps and the audio capture grow quickly.
; Select with run.ps1 -Config <path> or MotorStormNative.exe --config <path>.
; Relative paths resolve against this INI; environment/launcher options take precedence.

[graphics]
renderer = d3d12
resolution = 4
antialiasing = FXAA
texture_filtering = enhanced
widescreen = auto
vsync = true
fps = 60
; Fixed rate so slowdowns show up in the profile instead of being hidden.
dynamic_fps = false

[enhancements]
enabled = true
color_depth = 32
color_correction = true
exposure = 0.0
contrast = 1.0
saturation = 1.0
temperature = 0.0
tint = 0.0
sharpening = true
sharpening_strength = 0.2
hud_ungraded = true
soft_particles = true
soft_particle_softness = 600

[window]
enabled = true
fullscreen = false
fullscreen_mode = borderless
fullscreen_refresh = 0
scale = 2

[audio]
enabled = true
api = wasapi

[textures]
replace = true
budget_mb = 1024
dump = true
dump_dir = diagnostics/textures

[paths]

[logging]
log_file = diagnostics-full.log
trace_imports = true
trace_filesystem = true
verbose = true

[runtime]
max_dispatches = 4000000000

[debug]
profile = true
trace_controller = true
trace_music = true
trace_atrac = true
trace_display = true
pc_sample = true
; Requires Windows Graphics Tools (D3D12 debug layer).
d3d12_debug = true
trace_state = true
trace_switch = true
trace_flags = true
trace_callback_owner = true
trace_preempt = true
stack_scan = true
; Every GE submission, both buffers, keeping the latest 120 slots.
frame_dump = true
frame_dump_both = true
frame_dump_rolling = true
frame_dump_every = 1
frame_dump_count = 120
frame_dump_dir = diagnostics/frames
memory_dump = diagnostics-full.ram.bin
audio_capture = diagnostics-full.audio.raw
; stop_after_ge = 5000       ; uncomment for a bounded reproduction
